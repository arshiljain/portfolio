<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shopify Editions — Frontend Mirror</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fff}
    #app{min-height:100vh}
    #status{position:fixed;inset:0;display:grid;place-items:center;font:14px/1.4 system-ui,sans-serif;background:#fff;color:#111;z-index:9999}
    #status[hidden]{display:none}
  </style>
</head>
<body>
  <div id="status">Loading frontend…</div>
  <main id="app" aria-live="polite"></main>
  <script>
    (async () => {
      const SOURCE = '/www.shopify.com/editions/winter2026.html';
      const status = document.getElementById('status');
      const app = document.getElementById('app');

      const isExternal = (value) => {
        if (!value) return true;
        const v = value.trim();
        return v.startsWith('#') || v.startsWith('/') || v.startsWith('//') ||
          /^(?:https?:|data:|blob:|mailto:|javascript:|tel:|about:)/i.test(v);
      };

      const cleanUrl = (value) => {
        if (!value || isExternal(value)) return value;
        return new URL(value, location.origin + '/www.shopify.com/editions/').pathname +
          new URL(value, location.origin + '/www.shopify.com/editions/').search +
          new URL(value, location.origin + '/www.shopify.com/editions/').hash;
      };

      const rewriteSrcset = (value) => value.split(',').map(entry => {
        const parts = entry.trim().split(/\s+/);
        if (parts[0]) parts[0] = cleanUrl(parts[0]);
        return parts.join(' ');
      }).join(', ');

      try {
        const response = await fetch(SOURCE, { credentials: 'same-origin' });
        if (!response.ok) throw new Error(`Frontend source returned ${response.status}`);
        const html = await response.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');

        // This is intentionally a static frontend mirror. Do not execute Shopify/Hydrogen/Oxygen JS.
        doc.querySelectorAll('script, meta[http-equiv="refresh"], link[rel~="modulepreload"], link[as="script"]').forEach(el => el.remove());
        doc.querySelectorAll('base').forEach(el => el.remove());

        const base = doc.createElement('base');
        base.href = '/www.shopify.com/editions/';
        doc.head.prepend(base);

        doc.querySelectorAll('[src], [href], [poster], [data-src], [data-href], [srcset], [data-srcset]').forEach(el => {
          for (const attr of ['src','href','poster','data-src','data-href']) {
            if (el.hasAttribute(attr)) {
              const value = el.getAttribute(attr);
              if (value && !isExternal(value)) el.setAttribute(attr, cleanUrl(value));
            }
          }
          for (const attr of ['srcset','data-srcset']) {
            if (el.hasAttribute(attr)) el.setAttribute(attr, rewriteSrcset(el.getAttribute(attr)));
          }
        });

        document.title = doc.title || 'Shopify Editions';
        document.head.insertAdjacentHTML('beforeend', doc.head.innerHTML.replace(/<base[^>]*>/i, ''));
        app.innerHTML = doc.body.innerHTML;
        status.hidden = true;
      } catch (error) {
        status.textContent = 'Unable to load the frontend mirror.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
